<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anruf</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F2F7;font:18px -apple-system,system-ui,sans-serif;text-align:center}a{display:inline-block;padding:18px 36px;border-radius:18px;background:#34C759;color:#fff;font-weight:700;font-size:1.3rem;text-decoration:none}</style></head><body><div id="m"></div>
<script>var n=decodeURIComponent(location.hash.slice(1)).replace(/[^\d+]/g,"");document.getElementById("m").innerHTML='<p>'+n+'</p><a href="tel:'+n+'">Jetzt anrufen</a><p style="color:#8E8E93">Seite bleibt offen.</p>';setTimeout(function(){location.href="tel:"+n},30);</script></body></html>
