<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anruf</title>
<style>
  :root{color-scheme:light dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F2F2F7;color:#000;font:18px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
  @media (prefers-color-scheme:dark){body{background:#000;color:#fff}}
  .nr{font-size:1.4rem;font-weight:700;margin:6px 0 20px}
  a.b{display:inline-block;padding:16px 32px;border-radius:18px;background:#34C759;color:#fff;font-weight:700;font-size:1.25rem;text-decoration:none}
  small{display:block;margin-top:20px;color:#8E8E93}
</style>
</head>
<body>
<div id="m"></div>
<script>
  var n = decodeURIComponent(location.hash.slice(1)).replace(/[^\d+]/g, "");
  var m = document.getElementById("m");
  var gestartet = false, zu = false;

  // Sofort wieder zumachen: Fenster schließen; klappt das nicht, auf eine leere Seite wechseln und zurück
  // Nur schließen versuchen, nie zurücknavigieren (das lud die Zentrale neu)
  function weg() {
    if (zu) { return; }
    zu = true;
    try { window.close(); } catch (e) {}
    setTimeout(function () { m.innerHTML = "<div>Anruf gestartet.</div><small>Dieses Fenster schließen, dann bist du wieder in der Zentrale.</small>"; }, 300);
  }

  if (n.length > 4) {
    m.innerHTML = '<div>Anruf an</div><div class="nr"></div><a class="b" href="tel:' + n + '">Jetzt anrufen</a>';
    m.querySelector(".nr").textContent = n;
    // Anruf sofort auslösen, danach schnell wieder schließen
    gestartet = true; location.href = "tel:" + n;
    setTimeout(weg, 450);
    setTimeout(weg, 1500);
    document.addEventListener("visibilitychange", function () { if (gestartet && !document.hidden) { weg(); } });
    window.addEventListener("pageshow", function () { if (gestartet) { weg(); } });
    window.addEventListener("focus", function () { if (gestartet) { setTimeout(weg, 200); } });
  } else {
    m.textContent = "Keine Nummer übergeben.";
  }
</script>
</body>
</html>
